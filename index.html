<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUB-SUB-JS</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css"
    />
  </head>
  <body>
    <button id="add-email">Add Email</button>
    <button id="delete-mail-btn">Delete Email</button>

    <section>
      <!-- Subscriber	 -->
      <aside>
        <p>Inbox: <strong id="email-counter">0</strong></p>
        <hr />
        <!-- Subscriber	 -->
        <div id="list-container"></div>
      </aside>

      <main>
        <!-- Subscriber	 -->
        <div class="message">
          <div>
            <h2 id="email-title"></h2>
            <p id="email-body"></p>
          </div>
        </div>
      </main>
    </section>
  </body>
  <script src="./script.js"></script>
</html>
